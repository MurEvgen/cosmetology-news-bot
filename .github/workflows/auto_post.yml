name: Auto Post News

on:
  schedule:
    # Запуск каждый час
    - cron: '0 * * * *'
  workflow_dispatch: # Позволяет запустить вручную

# 🛡️ ВАЖНО: Разрешаем воркфлоу записывать изменения (делать git push)
permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        persist-credentials: true # Сохраняем токены для последующего push
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run bot
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python main.py
      
    - name: Commit and push memory file
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add posted_news.json
        git commit -m "chore: update memory file" || echo "No changes to commit"
        git push
